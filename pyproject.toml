[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-pipeline"
version = "0.1.0"
description = "End-to-end OCR pipeline for Baidu Unlimited-OCR on images and multi-page PDFs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.33.0",
  "addict>=2.4.0",
  "easydict>=1.13",
  "einops>=0.8.0",
  "fastapi>=0.115.0",
  "pydantic-settings>=2.4.0",
  "Pillow>=10.4.0",
  "pymupdf>=1.24.0",
  "python-multipart>=0.0.9",
  "torch>=2.3.0",
  "transformers==4.57.1",
  "typer>=0.12.3",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
ocr-pipeline = "ocr_pipeline.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
